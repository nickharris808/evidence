[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# DISTRIBUTION name only. The IMPORT name stays `evidence` -- `pip install evidence-runner`
# then `import evidence`. The bare name was already taken on PyPI by an unrelated project, and our
# README told readers to install it, so a reader following our documentation was installing
# somebody else's code. Renaming the distribution fixes that without a repo rename, an import
# change, or a single broken link.
name = "evidence-runner"
version = "0.1.0"
description = "Run the verification portfolio over your repo and get ONE verdict — the weakest leg, never the mean"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "evidence contributors" }]
keywords = ["verification", "audit", "ci", "sarif", "evidence", "aggregation", "attestation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# The constituents. `evidence` works without them — each missing tool reports MISSING and does
# not vote — but an audit is only as broad as the tools that actually ran.
#
# These were `name @ git+https://...` direct references, which PyPI forbids outright — the upload
# is rejected with a 400. They were written that way because none of these tools were on PyPI yet;
# now that they are, they become ordinary requirements.
#
# The first line was the dangerous one. It said plain `gridlock`, and `gridlock` on PyPI is an
# unrelated coupled-gridding library. `pip install "evidence[all]"` would have pulled a stranger's
# package into the user's environment as a dependency of ours — the same hazard we had already
# found in the README install lines, reproduced inside our own dependency list, where a reader
# would never think to look for it.
all = [
  "gridlock-certify>=0.1.0",
  "signoff-cert>=1.0.0",
  "honestbench>=0.2.0",
  "sf-verify>=0.1.0",
  "proof-to-code-drift>=0.1.0",
]

[project.scripts]
evidence = "evidence.cli:main"

[project.urls]
Homepage = "https://github.com/nickharris808/evidence"
Issues = "https://github.com/nickharris808/evidence/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
