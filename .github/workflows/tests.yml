name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
          # gridlock is installed so the end-to-end constituent tests actually RUN in CI.
          # Without it they skip, and a suite that silently skips its integration tests is a
          # suite that reports green about code it never executed.
          pip install "gridlock @ git+https://github.com/nickharris808/gridlock"
      - name: Test
        run: python -m pytest -q
